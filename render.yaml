services:
  - type: web
    name: computersales-backend-test
    runtime: node
    plan: free
    branch: render-test-deploy
    buildCommand: npm install --include=dev && (npx tsc --noEmitOnError false || test -f dist/index.js)
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
